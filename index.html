    <script>
      (function() {
        try {
          var _origFetch = window.fetch;
          var _bound = _origFetch ? _origFetch.bind(window) : undefined;
          var desc = {
            get: function() {
              return _bound;
            },
            set: function(val) {
              _bound = val;
            },
            configurable: true,
            enumerable: true
          };
          try {
            Object.defineProperty(window, 'fetch', desc);
          } catch (e1) {}
          if (typeof Window !== 'undefined' && Window.prototype) {
            try {
              Object.defineProperty(Window.prototype, 'fetch', desc);
            } catch (e2) {}
          }
        } catch (e) {}
      })();
    </script>
